name: Deploy
on:
  # Building on manual dispatch, and pushes to dev / main. But restricting
  workflow_dispatch:
  push:
    branches:
      - ourdna-browser-dev
      - milo-test

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ourdna-dev    # Add your cluster name here.
  GKE_ZONE: australia-southeast1-a   # Add your cluster zone here.
  DEPLOYMENT_NAME: ourdna-browser-dev-green # Add your deployment name here.
  DOCKER_REGISTRY: australia-southeast1-docker.pkg.dev

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: development
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
      # used for generating API
      API_DOCKER: $DOCKER_REGISTRY/$PROJECT_ID/gnomad/gnomad-api"
      BROWSER_DOCKER: "$DOCKER_REGISTRY/$PROJECT_ID/gnomad/gnomad-browser"

    defaults:
      run:
        shell: bash -eo pipefail -l {0}
    steps:
      - uses: actions/checkout@v4

      - id: "google-cloud-auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "projects/891247401758/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deploy@ourdna-browser-dev.iam.gserviceaccount.com"

      - id: "google-cloud-sdk-setup"
        name: "Set up Cloud SDK"
        uses: google-github-actions/setup-gcloud@v2

      - name: "gcloud docker auth"
        run: |
          gcloud --quiet auth configure-docker $DOCKER_REGISTRY

      - name: "build API image"
        run: |
          echo $DOCKER_REGISTRY
          echo $API_DOCKER
          echo "$API_DOCKER:${{ github.sha }}"
          docker build \
            --pull --provenance=false \
            --tag "$API_DOCKER:${{ github.sha }}" \
            --tag "$API_DOCKER:latest" \
            -f deploy/dockerfiles/browser/api.dockerfile \
            .

      - name: "build Browser image"
        run: |
          echo 'GNOMAD_API_URL="https://ourdna-dev.popgen.rocks/api"' > browser/build.env
          docker build \
            --pull --provenance=false \
            --tag $BROWSER_DOCKER:${{ github.sha }} \
            --tag $BROWSER_DOCKER:latest \
            -f deploy/dockerfiles/browser/browser.dockerfile \
            .

      # Push the Docker image to Google Container Registry
      - name: Publish
        run: |-
          docker push $API_DOCKER:${{ github.sha }}
          docker push $BROWSER_DOCKER:${{ github.sha }}

      # Configure kubectl
      - name: "gcloud kubectl"
        run: |-
          gcloud container clusters get-credentials $GKE_CLUSTER --region=$GKE_ZONE

      # Deploy the Docker image to the GKE cluster
      - name: Deploy API
        run: |-
          kubectl set image deployment/$DEPLOYMENT_NAME app=$API_DOCKER:${{ github.sha }}
          kubectl rollout status deployment/$DEPLOYMENT_NAME

      # Deploy the Docker image to the GKE cluster
      - name: Deploy Web
        run: |-
          kubectl set image deployment/$DEPLOYMENT_NAME web=$BROWSER_DOCKER:${{ github.sha }}
          kubectl rollout status deployment/$DEPLOYMENT_NAME
